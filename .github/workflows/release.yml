name: Release Windows App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Read app version
        id: version
        shell: pwsh
        run: echo "version=$(node -p \"require('./package.json').version\")" >> $env:GITHUB_OUTPUT

      - name: Build Electron and web
        run: npm run build

      - name: Package Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: overlay-monster-windows-${{ steps.version.outputs.version }}
          path: |
            release/*.exe
            release/latest.yml

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Overlay Monster v${{ steps.version.outputs.version }}
          body: Windows release v${{ steps.version.outputs.version }}.
          prerelease: false
          make_latest: true
          files: |
            release/Overlay-Monster-Setup.exe
            release/latest.yml
          fail_on_unmatched_files: true
