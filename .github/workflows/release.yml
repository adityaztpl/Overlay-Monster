name: Release Windows App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix, for example 0.2.9'
        required: true
        type: string

concurrency:
  group: overlay-monster-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Read and validate app version
        id: version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $releaseVersion = '${{ inputs.version }}'
          }
          if ($packageVersion -ne $releaseVersion) {
            throw "package.json version ($packageVersion) does not match release version ($releaseVersion)."
          }
          "version=$releaseVersion" >> $env:GITHUB_OUTPUT

      - name: Typecheck
        run: npm run typecheck

      - name: Build Electron and web
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify release artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "release/Overlay-Monster-Setup.exe")) { throw 'Installer was not generated.' }
          if (-not (Test-Path "release/latest.yml")) { throw 'latest.yml was not generated.' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: overlay-monster-windows-${{ steps.version.outputs.version }}
          path: |
            release/*.exe
            release/latest.yml

      - name: Publish versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Overlay Monster v${{ steps.version.outputs.version }}
          body: Windows release v${{ steps.version.outputs.version }}.
          prerelease: false
          make_latest: true
          files: |
            release/Overlay-Monster-Setup.exe
            release/latest.yml
          fail_on_unmatched_files: true
          overwrite_files: true
